<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYDRAGO Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #a9b1d6;
      overflow: hidden;
    }
    .matrix-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.1;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 20px,
        rgba(99,179,237,0.03) 20px,
        rgba(99,179,237,0.03) 21px
      );
    }
    .title {
      font-size: 28px;
      font-weight: bold;
      color: #7dcfff;
      text-shadow: 0 0 20px #63B3ED, 0 0 40px #63B3ED;
      margin-bottom: 5px;
      letter-spacing: 4px;
      animation: glow 2s ease-in-out infinite alternate;
    }
    .subtitle {
      font-size: 12px;
      color: #bb9af7;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #63B3ED, 0 0 20px #63B3ED; }
      to { text-shadow: 0 0 25px #7dcfff, 0 0 50px #7dcfff; }
    }
    #gameCanvas {
      border: 3px solid #63B3ED;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(99,179,237,0.3), inset 0 0 30px rgba(99,179,237,0.1);
    }
    .score-panel {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .score-panel span {
      color: #7dcfff;
    }
    .score-panel .label {
      color: #565f89;
    }
    .high-score {
      color: #f7768e !important;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .btn {
      background: linear-gradient(135deg, #1a1b26, #2D3748);
      border: 2px solid #63B3ED;
      color: #7dcfff;
      padding: 10px 25px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .btn:hover {
      background: #63B3ED;
      color: #0d0d1a;
      box-shadow: 0 0 20px #63B3ED;
    }
    .btn-danger {
      border-color: #f7768e;
      color: #f7768e;
    }
    .btn-danger:hover {
      background: #f7768e;
      color: #0d0d1a;
      box-shadow: 0 0 20px #f7768e;
    }
    .instructions {
      margin-top: 15px;
      font-size: 11px;
      color: #565f89;
      text-align: center;
    }
    .instructions kbd {
      background: #2D3748;
      border: 1px solid #63B3ED;
      border-radius: 3px;
      padding: 2px 6px;
      color: #7dcfff;
    }
    .footer {
      margin-top: 20px;
      font-size: 10px;
      color: #565f89;
      text-align: center;
    }
    .footer a {
      color: #bb9af7;
      text-decoration: none;
    }
    .mobile-controls {
      display: none;
      margin-top: 15px;
      gap: 5px;
    }
    .mobile-controls button {
      width: 50px;
      height: 50px;
      font-size: 20px;
      background: #1a1b26;
      border: 2px solid #63B3ED;
      border-radius: 8px;
      color: #7dcfff;
      cursor: pointer;
    }
    .mobile-controls button:active {
      background: #63B3ED;
      color: #0d0d1a;
    }
    @media (max-width: 600px) {
      .mobile-controls { display: grid; grid-template-columns: repeat(3, 50px); }
      .title { font-size: 20px; }
    }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(13,13,26,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-title {
      font-size: 36px;
      color: #7dcfff;
      text-shadow: 0 0 30px #63B3ED;
      margin-bottom: 10px;
    }
    .overlay-score {
      font-size: 20px;
      color: #bb9af7;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="matrix-bg"></div>

  <div class="title">🐍 SKYDRAGO SNAKE 🐍</div>
  <div class="subtitle">// The legendary snake game //</div>

  <div class="score-panel">
    <div><span class="label">SCORE:</span> <span id="score">0</span></div>
    <div><span class="label">HIGH:</span> <span id="highScore" class="high-score">0</span></div>
    <div><span class="label">LEVEL:</span> <span id="level">1</span></div>
  </div>

  <canvas id="gameCanvas" width="480" height="400"></canvas>

  <div class="controls">
    <button class="btn" id="startBtn">START GAME</button>
    <button class="btn btn-danger" id="pauseBtn">PAUSE</button>
    <button class="btn" id="resetBtn">RESET</button>
  </div>

  <div class="instructions">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move
    &nbsp;|&nbsp; <kbd>P</kbd> to pause &nbsp;|&nbsp; <kbd>SPACE</kbd> to start
  </div>

  <div class="mobile-controls">
    <button></button>
    <button id="upBtn">↑</button>
    <button></button>
    <button id="leftBtn">←</button>
    <button id="downBtn">↓</button>
    <button id="rightBtn">→</button>
  </div>

  <div class="footer">
    Built with ❤️ by <a href="https://github.com/SKYDRAGO-DEV">SKYDRAGO-DEV</a>
    &nbsp;|&nbsp; <a href="https://github.com/SKYDRAGO-DEV/snake-game">View Source</a>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const levelEl = document.getElementById('level');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    const COLS = 24, ROWS = 20, CELL = 20;
    let snake, food, dir, nextDir, gameLoop, score, level, speed, running, paused, gameOver;

    // Load high score
    let highScore = parseInt(localStorage.getItem('skydragoSnakeHigh') || '0');
    highScoreEl.textContent = highScore;

    function init() {
      snake = [{ x: 12, y: 10 }, { x: 11, y: 10 }, { x: 10, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      speed = 150;
      gameOver = false;
      paused = false;
      scoreEl.textContent = '0';
      levelEl.textContent = '1';
      spawnFood();
    }

    function spawnFood() {
      do {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#1a1b26';
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Snake body
      snake.forEach((seg, i) => {
        const alpha = 1 - (i / snake.length) * 0.5;
        const hue = 200 + (i * 3);
        ctx.fillStyle = `hsla(${hue}, 70%, 60%, ${alpha})`;
        ctx.shadowColor = '#63B3ED';
        ctx.shadowBlur = i === 0 ? 15 : 5;
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
        ctx.fill();
      });

      // Snake eyes
      const head = snake[0];
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0d0d1a';
      const eyeSize = 3;
      if (dir.x === 1) {
        ctx.beginPath(); ctx.arc(head.x * CELL + 14, head.y * CELL + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(head.x * CELL + 14, head.y * CELL + 14, eyeSize, 0, Math.PI * 2); ctx.fill();
      } else if (dir.x === -1) {
        ctx.beginPath(); ctx.arc(head.x * CELL + 6, head.y * CELL + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(head.x * CELL + 6, head.y * CELL + 14, eyeSize, 0, Math.PI * 2); ctx.fill();
      } else if (dir.y === 1) {
        ctx.beginPath(); ctx.arc(head.x * CELL + 6, head.y * CELL + 14, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(head.x * CELL + 14, head.y * CELL + 14, eyeSize, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(head.x * CELL + 6, head.y * CELL + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(head.x * CELL + 14, head.y * CELL + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
      }

      // Food
      ctx.shadowColor = '#f7768e';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#f7768e';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Food sparkle
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff9ecd';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2 - 3, food.y * CELL + CELL / 2 - 3, 2, 0, Math.PI * 2);
      ctx.fill();

      // Game over overlay
      if (gameOver) {
        ctx.fillStyle = 'rgba(13,13,26,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f7768e';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#bb9af7';
        ctx.font = '18px Courier New';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillStyle = '#565f89';
        ctx.font = '14px Courier New';
        ctx.fillText('Press SPACE or START to play again', canvas.width / 2, canvas.height / 2 + 45);
      }

      // Paused overlay
      if (paused && !gameOver) {
        ctx.fillStyle = 'rgba(13,13,26,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#7dcfff';
        ctx.font = 'bold 28px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ PAUSED', canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#565f89';
        ctx.font = '14px Courier New';
        ctx.fillText('Press P to resume', canvas.width / 2, canvas.height / 2 + 30);
      }

      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
    }

    function update() {
      if (paused || gameOver) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        endGame(); return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame(); return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10 * level;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('skydragoSnakeHigh', highScore);
        }
        // Level up every 50 points
        if (score % 50 === 0 && level < 10) {
          level++;
          levelEl.textContent = level;
          speed = Math.max(50, 150 - (level - 1) * 10);
          clearInterval(gameLoop);
          gameLoop = setInterval(tick, speed);
        }
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function tick() {
      update();
      draw();
    }

    function startGame() {
      if (running) return;
      init();
      running = true;
      gameOver = false;
      draw();
      gameLoop = setInterval(tick, speed);
    }

    function resetGame() {
      clearInterval(gameLoop);
      running = false;
      gameOver = false;
      paused = false;
      init();
      draw();
    }

    function endGame() {
      gameOver = true;
      clearInterval(gameLoop);
      running = false;
      draw();
    }

    function togglePause() {
      if (!running || gameOver) return;
      paused = !paused;
      draw();
    }

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
          if (dir.y !== 1) nextDir = { x: 0, y: -1 };
          e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S':
          if (dir.y !== -1) nextDir = { x: 0, y: 1 };
          e.preventDefault(); break;
        case 'ArrowLeft': case 'a': case 'A':
          if (dir.x !== 1) nextDir = { x: -1, y: 0 };
          e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D':
          if (dir.x !== -1) nextDir = { x: 1, y: 0 };
          e.preventDefault(); break;
        case ' ':
          if (!running) startGame();
          else if (gameOver) resetGame();
          e.preventDefault(); break;
        case 'p': case 'P':
          togglePause(); break;
      }
    });

    startBtn.addEventListener('click', () => { if (!running) startGame(); else if (gameOver) resetGame(); });
    pauseBtn.addEventListener('click', () => { if (running) togglePause(); });
    resetBtn.addEventListener('click', resetGame);

    // Mobile controls
    document.getElementById('upBtn').addEventListener('touchstart', e => { e.preventDefault(); if (dir.y !== 1) nextDir = { x: 0, y: -1 }; });
    document.getElementById('downBtn').addEventListener('touchstart', e => { e.preventDefault(); if (dir.y !== -1) nextDir = { x: 0, y: 1 }; });
    document.getElementById('leftBtn').addEventListener('touchstart', e => { e.preventDefault(); if (dir.x !== 1) nextDir = { x: -1, y: 0 }; });
    document.getElementById('rightBtn').addEventListener('touchstart', e => { e.preventDefault(); if (dir.x !== -1) nextDir = { x: 1, y: 0 }; });

    // Init and draw initial state
    init();
    draw();
  </script>
</body>
</html>
