name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline script, found {len(scripts)}")
          Path("/tmp/snake-game.js").write_text(scripts[0], encoding="utf-8")
          PY

      - name: Check JavaScript syntax
        run: node --check /tmp/snake-game.js
